name: Deploy

on:
  push:
    branches: [main]

# Least-privilege default — this workflow only needs to read the repo to
# check it out; it deploys over SSH, not via any GitHub API write.
permissions:
  contents: read

# A second push mid-deploy should queue behind the first, never run
# concurrently against the same VPS.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      # Not `npm test` — that includes *.integration.test.ts and
      # tests/edge-cases/**, which require a live server + seeded Postgres
      # (TEST_BASE_URL) that doesn't exist in this runner and fail loudly,
      # not skip (see src/test/apiIntegrationHelpers.ts). test:unit runs
      # only the mocked-Prisma/mocked-auth suite, which is self-contained.
      - run: npm run test:unit

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_BUSINESS_PHONE: ${{ secrets.NEXT_PUBLIC_BUSINESS_PHONE }}
          NEXT_PUBLIC_BUSINESS_WHATSAPP: ${{ secrets.NEXT_PUBLIC_BUSINESS_WHATSAPP }}
          NEXT_PUBLIC_BUSINESS_EMAIL: ${{ secrets.NEXT_PUBLIC_BUSINESS_EMAIL }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ secrets.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # appleboy/ssh-action exports exactly these names into the remote
          # shell below — nothing else from this job's env leaks over SSH,
          # and nothing here is ever printed (no `echo`/`set -x` on secrets).
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,NEXTAUTH_SECRET,NEXTAUTH_URL,NEXT_PUBLIC_BUSINESS_PHONE,NEXT_PUBLIC_BUSINESS_WHATSAPP,NEXT_PUBLIC_BUSINESS_EMAIL,NEXT_PUBLIC_BUSINESS_ADDRESS,NEXT_PUBLIC_SITE_URL,DOMAIN_NAME,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/chaitanya-stores}"

            git pull --ff-only origin main

            umask 077
            cat > .env <<ENVEOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
            NEXTAUTH_URL=${NEXTAUTH_URL}
            NEXT_PUBLIC_BUSINESS_PHONE=${NEXT_PUBLIC_BUSINESS_PHONE}
            NEXT_PUBLIC_BUSINESS_WHATSAPP=${NEXT_PUBLIC_BUSINESS_WHATSAPP}
            NEXT_PUBLIC_BUSINESS_EMAIL=${NEXT_PUBLIC_BUSINESS_EMAIL}
            NEXT_PUBLIC_BUSINESS_ADDRESS=${NEXT_PUBLIC_BUSINESS_ADDRESS}
            NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
            DOMAIN_NAME=${DOMAIN_NAME}
            ENVEOF
            chmod 600 .env

            # Forward-only schema migrations, run from the dedicated
            # `migrator` build stage (see docker-compose.yml's `migrate`
            # service) — never `migrate reset`, never a destructive command
            # here. `--build` is required: Compose only builds an image on
            # `run` when it's absent, so without it this would silently
            # reuse whatever `migrate` image was built on a *previous*
            # deploy — running old migrations against new code, meaning a
            # new migration in this push would never actually apply.
            # Runs BEFORE the app is recreated so new code never queries a
            # column/table that doesn't exist yet. This only fully covers
            # purely additive migrations — a migration that drops/renames
            # something the currently-live code still references needs the
            # two-deploy pattern instead (see deployment guide Section 8.4).
            docker compose --profile tools run --rm --build migrate

            # Build+recreate the app; db/nginx are only touched if their own
            # config changed. Never `-v`, never `down` — volumes are untouched.
            docker compose up -d --build db web nginx

            # nginx caches the `web` hostname's resolved IP at config load;
            # recreating `web` above gives it a new IP on the Docker bridge
            # network, so reload nginx or it keeps proxying to the stale IP
            # and every deploy causes intermittent 502s.
            docker compose exec nginx nginx -s reload

            docker image prune -f
